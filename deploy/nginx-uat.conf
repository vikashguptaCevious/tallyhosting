# /etc/nginx/sites-available/tallyhosting-uat
#
# The landing site is served statically from /var/www/tallyhosting, but
# POST /api/bitrix/lead must reach the Node server (npm start, port 4173).
# nginx cannot answer a POST with a static file, so without the /api/ proxy
# below it replies 405 by itself and the enquiry form fails.

# Landing
server {
    listen 443 ssl http2;
    server_name uat.tallyhosting.com;

    root /var/www/tallyhosting;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ceviouscloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceviouscloud.com/privkey.pem;

    # Lead API — must live in THIS block (uat.tallyhosting.com),
    # not in the *.uat.tallyhosting.com wildcard block.
    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Customer wildcard
server {
    listen 443 ssl http2;
    server_name *.uat.tallyhosting.com;

    root /var/www/ceviouscloud;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ceviouscloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceviouscloud.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
