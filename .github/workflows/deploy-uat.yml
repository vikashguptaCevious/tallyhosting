name: Deploy UAT

on:
  push:
    branches:
      - uat
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to uat.tallyhosting.com
    runs-on: [self-hosted, linux, uat]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build for UAT
        run: npm run build:uat

      - name: Deploy to /var/www/tallyhosting
        run: |
          rsync -avzr --delete dist/ /var/www/tallyhosting/
