name: Deploy UAT

on:
  push:
    branches:
      - uat
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: true

env:
  UAT_SSH_HOST: 163.223.144.288
  UAT_SSH_USER: ubuntu
  UAT_SSH_PORT: "22"
  UAT_DEPLOY_PATH: /var/www/tallyhosting

jobs:
  deploy:
    name: Build & deploy to uat.tallyhosting.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build for UAT
        run: npm run build:uat

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.UAT_SSH_PRIVATE_KEY }}" | tr -d ' \t\r\n' | base64 --ignore-garbage -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Deploy to server
        run: |
          rsync -avzr --delete \
            -e "ssh -p ${{ env.UAT_SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" \
            dist/ \
            "${{ env.UAT_SSH_USER }}@${{ env.UAT_SSH_HOST }}:${{ env.UAT_DEPLOY_PATH }}/"
