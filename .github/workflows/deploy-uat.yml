name: Deploy UAT

on:
  push:
    branches:
      - uat
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: true

env:
  UAT_DEPLOY_PATH: /var/www/tallyhosting

jobs:
  build:
    name: Build UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build for UAT
        run: npm run build:uat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uat-dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to uat.tallyhosting.com
    needs: build
    runs-on: [self-hosted, linux, uat]

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: uat-dist
          path: dist/

      - name: Deploy to server folder
        run: rsync -avzr --delete dist/ "${{ env.UAT_DEPLOY_PATH }}/"
