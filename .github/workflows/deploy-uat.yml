name: Deploy UAT

on:
  push:
    branches:
      - uat
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to uat.tallyhosting.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build for UAT
        run: npm run build:uat

      - name: Deploy to server (/var/www/tallyhosting)
        uses: burnett01/rsync-deployments@8.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/tallyhosting/
          remote_host: ${{ secrets.UAT_SSH_HOST }}
          remote_user: ${{ secrets.UAT_SSH_USER }}
          remote_key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
